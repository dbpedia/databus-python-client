steps:
  - name: fetch_dataset
    command: download
    uri: https://raw.githubusercontent.com/dbpedia/databus/master/server/app/api/swagger.yml
    localdir: ./workflow-output/full-pipeline

  - name: publish_dataset
    command: deploy
    version_id: https://databus.dbpedia.org/DhanashreeP/test-group/workflow-full/1.0
    title: "Workflow Demo - Full Pipeline"
    abstract: "throwaway, testing full download-deploy-delete pipeline"
    description: "throwaway version testing all three commands chained together"
    license: https://creativecommons.org/licenses/by-sa/3.0/
    api_key: 53a899fe-1c7f-4426-8cbf-3a7c9fc15405
    files: ${steps.fetch_dataset.output_urls}
    on_error: fail

  - name: cleanup_previous_version
    command: delete
    uris:
      - https://databus.dbpedia.org/DhanashreeP/test-group/workflow-full/0.9
    api_key: 53a899fe-1c7f-4426-8cbf-3a7c9fc15405
    on_error: continue