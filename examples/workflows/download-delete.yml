    command: download
    uri: https://raw.githubusercontent.com/dbpedia/databus/master/server/app/api/swagger.yml
    localdir: ./workflow-output/download-delete

  - name: cleanup_old
    command: delete
    uris:
      - https://databus.dbpedia.org/DhanashreeP/test-group/deleteme/1.0
    api_key: ${DATABUS_API_KEY}